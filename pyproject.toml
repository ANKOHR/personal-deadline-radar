[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "personal-deadline-radar"
version = "0.1.0"
description = "Deterministic local deadline detection with explicit provenance"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
pdr = "personal_deadline_radar.cli:main"

[tool.setuptools.packages.find]
include = ["personal_deadline_radar*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
